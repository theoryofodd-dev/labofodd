<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>labofodd - Authorization</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#111}code{display:block;padding:12px;background:#f2f2f2;border-radius:6px;word-break:break-all;user-select:all}</style></head><body>
<h1>labofodd</h1>
<p id="msg">Authorization received.</p>
<code id="code" hidden></code>
<p id="hint" hidden>This is a private publishing tool used only by the labofodd team. Copy the code above and give it to the tool, then close this page.</p>
<script>
var p = new URLSearchParams(location.search);
var m = document.getElementById('msg');
if (p.get('error')) { m.textContent = 'Authorization was not completed: ' + (p.get('error_description') || p.get('error')); }
else if (p.get('code')) { var c = document.getElementById('code'); c.textContent = p.get('code'); c.hidden = false; document.getElementById('hint').hidden = false; }
</script></body></html>
